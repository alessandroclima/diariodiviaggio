name: Deploy Backend API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "DiarioDiViaggioApi/**"
      - "diariodiviaggioBE/DiarioDiViaggioApi/**"
      - ".github/workflows/deploy-backend.yml"
      - "diariodiviaggioBE/.github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  PUBLISH_PATH: "${{ github.workspace }}/publish_output"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Locate backend project
        id: locate-project
        shell: bash
        run: |
          PROJECT_PATH="$(find . -type f -name 'DiarioDiViaggioApi.csproj' | head -n 1)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "DiarioDiViaggioApi.csproj not found"
            exit 1
          fi
          echo "Using project: $PROJECT_PATH"
          echo "project_path=${PROJECT_PATH#./}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore ${{ steps.locate-project.outputs.project_path }}

      - name: Build
        run: dotnet build ${{ steps.locate-project.outputs.project_path }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ steps.locate-project.outputs.project_path }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-api
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-api
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
